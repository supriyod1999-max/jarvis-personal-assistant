plugins { id 'com.android.application' }
android {
    namespace 'org.jarvisassistant.app'
    compileSdk 36
    defaultConfig {
        applicationId providers.gradleProperty('jarvisDesignPreview').isPresent() ? 'org.jarvisassistant.app.design' : 'org.jarvisassistant.app'
        minSdk 30
        targetSdk 36
        versionCode providers.gradleProperty('jarvisDesignPreview').isPresent() && providers.gradleProperty('jarvisPreviewNext').isPresent() ? 19 : 18
        versionName '0.15.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main {
            java.srcDirs += ['../shared/src/main/java', 'build/generated/reused']
            assets.srcDir '../app/src/main/assets'
            assets.exclude 'music/**'
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear.tiles:tiles:1.5.0'
    implementation 'androidx.wear.protolayout:protolayout:1.3.0'
    implementation 'com.google.guava:guava:33.4.0-android'
    implementation files('../app/libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}
// Reuse the checksum-verified detector and segmenter without maintaining a fork.
tasks.register('reuseVoiceSources', Copy) {
    from('../app/src/main/java/org/jarvisassistant/app') { include 'LocalWake.java', 'SpeechSegmenter.java', 'EndpointPolicy.java', 'VoiceRules.java' }
    into layout.buildDirectory.dir('generated/reused/org/jarvisassistant/app')
}
tasks.named('preBuild').configure { dependsOn ':app:verifyWakeAssets', 'reuseVoiceSources' }
